<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0b12" />
    <meta
      name="description"
      content="An interactive 3D tour of the solar system"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Solar System</title>
    <style>
      /* pre-bundle shim: void background + a pulsing sun-dot at the exact
         center, so there is never a raw black frame before React mounts.
         the React loading screen draws its sun-dot at the same spot. */
      html, body { margin: 0; background: #0d0b12; }
      .boot {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 9px;
        height: 9px;
        margin: -4.5px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff6e8, #ffd9a0 70%);
        box-shadow: 0 0 18px 5px rgba(255, 214, 160, 0.45);
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.55; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) { .boot { animation: none; } }
    </style>
  </head>
  <body>

    <div id="root"><div class="boot"></div></div>

  </body>
</html>
